name: 每日早报更新

on:
  schedule:
    # 07:00 北京时间（UTC+8）= 23:00 UTC 前一天
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'index.html'
      - '.github/workflows/daily.yml'

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成早报
        run: node scripts/build.mjs

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "brief: $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
